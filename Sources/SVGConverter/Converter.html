<!DOCTYPE html>
<html>
	<head>
		<script>

			function scaled({
				svg,
				scale
			}) {

				const doc = (new DOMParser()).parseFromString(
					svg,
					'image/svg+xml');

				const root = doc.documentElement;

				if (root.nodeName !== 'svg') {
					throw new Error('Root element is not an SVG.');
				}

				const length = (value) => {
					const match = /^\s*([\d.eE+-]+)\s*(px)?\s*$/.exec(value || '');
					return match ? parseFloat(match[1]) : undefined;
				}

				const viewBox = root.getAttribute('viewBox')?.trim().split(/[\s,]+/).map(Number);
				const hasViewBox = viewBox?.length === 4 && viewBox.every(Number.isFinite);

				let width = length(root.getAttribute('width'));
				let height = length(root.getAttribute('height'));

				if (hasViewBox) {
					const ratio = viewBox[3] / viewBox[2];
					width ??= height !== undefined ? height / ratio : viewBox[2];
					height ??= width * ratio
				}

				if (width === undefined || height === undefined) {
					throw new Error('Unable to determine SVG dimensions.');
				}

				if (!hasViewBox) {
					root.setAttribute('viewBox', `0 0 ${width} ${height}`);
				}

				root.setAttribute('width', width * scale);
				root.setAttribute('height', height * scale);

				return (new XMLSerializer())
					.serializeToString(root);

			}

			function convert({
				uuid,
				svg,
				scale
			}) {

				const domReady = new Promise((resolve) => {
					if (document.readyState === 'complete') resolve();
					document.addEventListener('DOMContentLoaded', resolve);
				});

				const send = (what) => {

					const payload = JSON.stringify(
						what)

					if (window.SVGConverter) {
						window.SVGConverter.postMessage(
							payload)
					} else {
						window.webkit?.messageHandlers.converter.postMessage(
							payload);
					}

				};

				const failed = (error) => {
					send({
						uuid,
						result: 'failure',
						message: error.message || "Unknown error."
					});
				};

				(async () => {

					await domReady;

					const canvas = document.createElement('canvas');
					const context = canvas.getContext('2d');

					try {

						svg = scaled({
							svg,
							scale
						});

						const image = new Image();

						const url = URL.createObjectURL(
							new Blob([svg], { type: 'image/svg+xml' }));

						await new Promise((resolve, reject) => {

							image.onload = resolve;
							image.onerror = reject;

							image.src = url

						});

						canvas.width = image.naturalWidth;
						canvas.height = image.naturalHeight;

						context.imageSmoothingEnabled = true;
						context.imageSmoothingQuality = 'high';

						context.drawImage(
							image,
							0,
							0,
							image.naturalWidth,
							image.naturalHeight);

						URL.revokeObjectURL(
							url);

						const png = await new Promise((resolve) => {
							canvas.toBlob(resolve, 'image/png');
						});

						send({
							command: 'png',
							uuid,
							result: 'success',
							image: await new Promise((resolve, reject) => {

								const reader = new FileReader();

								reader.onload = () => resolve(reader.result);
								reader.onerror = reject;

								reader.readAsDataURL(png);

							})
						});

					} catch (error) {
						failed(error);
					}

				})().catch(failed);

			};

		</script>
	</head>
	<body>
	</body>
</html>
